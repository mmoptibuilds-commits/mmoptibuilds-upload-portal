name: Verify portal

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm test
      - name: Production build
        env:
          # The build evaluates server routes, but CI must never need real
          # database or storage credentials. Vercel receives the real values
          # as encrypted environment variables at runtime.
          DATABASE_URL: postgresql://postgres:ci-placeholder@127.0.0.1:5432/postgres
          AUTH_SECRET: ci-only-placeholder-secret-at-least-32-characters
          SUPABASE_URL: https://ci-placeholder.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ci-placeholder-service-role-key
          SUPABASE_STORAGE_BUCKET: client-uploads
        run: npm run build
